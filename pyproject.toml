[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-liquidity-bot"
version = "0.1.0"
description = "Windows-native Kalshi liquidity bot: execution-disabled foundation"
requires-python = ">=3.12"
dependencies = ["tzdata>=2025.2", "cryptography>=46,<51", "websockets>=15,<17"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
